<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Sales Co-Pilot</title>
</head>
<body>
  <!-- Header -->
  <div class="popup-header">
    <div class="logo-section">
      <img src="../icons/icon48.png" style="height:22px; width:22px; margin-right:6px; vertical-align:middle;" />
      <span class="logo-text">XOrtLogix Co-Pilot</span>
    </div>
    <span id="backendStatus" class="status-badge offline">🔴 Offline</span>
  </div>

  <!-- Meeting Connection Section -->
  <div class="meeting-connect-section">
    <div class="section-label-prominent">🔗 PASTE MEETING LINK (Google Meet / Zoom / Teams)</div>
    <div class="input-group prominent">
      <span class="input-icon">🌐</span>
      <input type="text" id="meetingUrlInput" placeholder="https://meet.google.com/xyz-abc-def" autofocus autocomplete="off" />
      <button id="btnPasteUrl" class="icon-btn" title="Paste from clipboard">📋 Paste</button>
    </div>
    
    <div class="button-group">
      <button id="btnConnectMeeting" class="connect-btn primary glowing">
        <span class="btn-icon">🚀</span>
        <span id="connectBtnText">Connect to Meeting & Start Detection</span>
      </button>
      <button id="btnToggleCapture" class="capture-btn secondary">
        <span class="btn-icon">🎤</span>
        <span id="btnText">Listen Active Tab Instead</span>
      </button>
    </div>
    <p id="captureStatus" class="capture-status">Paste link above & click Connect to attach Co-Pilot</p>
  </div>

  <!-- Live Transcript Preview -->
  <div class="transcript-section">
    <div class="section-label">Live Speech Stream</div>
    <div id="liveTranscript" class="transcript-box">Waiting for meeting audio...</div>
  </div>

  <!-- Last Strategy Found -->
  <div class="strategy-section" id="strategySection" style="display:none">
    <div class="section-label">🎯 Detected Objection & Strategy</div>
    <div id="lastStrategy" class="strategy-preview"></div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat"><span id="queryCount">0</span><small>Queries</small></div>
    <div class="stat"><span id="matchCount">0</span><small>Matches</small></div>
    <div class="stat"><span id="sessionTime">00:00</span><small>Session</small></div>
  </div>

  <!-- Footer -->
  <div class="popup-footer">
    <small>Local AI Backend: <span id="backendUrl">127.0.0.1:8000</span></small>
  </div>

  <script src="popup.js"></script>
</body>
</html>
