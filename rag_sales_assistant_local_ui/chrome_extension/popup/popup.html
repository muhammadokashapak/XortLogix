<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Sales Co-Pilot</title>
</head>
<body>
  <!-- Header -->
  <div class="popup-header">
    <div class="logo-section">
      <span class="logo-icon">🎯</span>
      <span class="logo-text">Sales Co-Pilot</span>
    </div>
    <span id="backendStatus" class="status-badge offline">🔴 Offline</span>
  </div>

  <!-- Meeting Connection Section -->
  <div class="meeting-connect-section">
    <div class="section-label">Meeting Connection</div>
    <div class="input-group">
      <span class="input-icon">🔗</span>
      <input type="text" id="meetingUrlInput" placeholder="Paste Google Meet / Zoom URL..." autocomplete="off" />
      <button id="btnPasteUrl" class="icon-btn" title="Paste from clipboard">📋</button>
    </div>
    
    <div class="button-group">
      <button id="btnConnectMeeting" class="connect-btn primary">
        <span class="btn-icon">🚀</span>
        <span id="connectBtnText">Connect to Meeting</span>
      </button>
      <button id="btnToggleCapture" class="capture-btn secondary">
        <span class="btn-icon">🎤</span>
        <span id="btnText">Listen Active Tab</span>
      </button>
    </div>
    <p id="captureStatus" class="capture-status">Enter meeting URL or listen to active tab</p>
  </div>

  <!-- Live Transcript Preview -->
  <div class="transcript-section">
    <div class="section-label">Live Speech Transcript</div>
    <div id="liveTranscript" class="transcript-box">Waiting for meeting audio...</div>
  </div>

  <!-- Last Strategy Found -->
  <div class="strategy-section" id="strategySection" style="display:none">
    <div class="section-label">🎯 Detected Objection & Strategy</div>
    <div id="lastStrategy" class="strategy-preview"></div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat"><span id="queryCount">0</span><small>Queries</small></div>
    <div class="stat"><span id="matchCount">0</span><small>Matches</small></div>
    <div class="stat"><span id="sessionTime">00:00</span><small>Session</small></div>
  </div>

  <!-- Footer -->
  <div class="popup-footer">
    <small>Local AI Backend: <span id="backendUrl">127.0.0.1:8000</span></small>
  </div>

  <script src="popup.js"></script>
</body>
</html>
